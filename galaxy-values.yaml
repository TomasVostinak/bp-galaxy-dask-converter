ingress:
  enabled: true
  ingressClassName: "nginx"
  hosts:
    - host: galaxy-vostinak.dyn.cloud.e-infra.cz
      paths:
        - path: /
          pathType: Prefix

cvmfs:
  enabled: false
  cvmfscsi:
    enabled: false

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

extraVolumes:
  - name: mytools-volume
    configMap:
      name: galaxy-my-tools

extraVolumeMounts:
  - name: mytools-volume
    mountPath: /galaxy/tools/mytools

configs:
  tool_conf.xml: |
    <?xml version='1.0' encoding='utf-8'?>
    <toolbox monitor="true" tool_path="/galaxy/tools">
      <section id="custom_s3_tools" name="S3 Dask Nástroje">
        <tool file="/galaxy/tools/mytools/transform_s3.xml" />
      </section>
    </toolbox>

postgresql:
  enabled: true
  auth:
    database: galaxy
    username: galaxy
    password: "galaxy_db_password_123"
  primary:
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

rabbitmq:
  enabled: true
  auth:
    username: galaxy
    password: "galaxy_rmq_password_123"
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
