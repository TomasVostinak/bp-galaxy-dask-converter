apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1450
        runAsGroup: 1450
        fsGroup: 1450
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: galaxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NONUSE
              value: "rabbitmq,reports,proftpd,nodejs,postgres"
            - name: GALAXY_CONFIG_ENABLE_CELERY_TASKS
              value: "false"
            - name: GALAXY_CONFIG_DATABASE_CONNECTION
              value: "sqlite:////tmp/universe.sqlite?isolation_level=IMMEDIATE"
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}