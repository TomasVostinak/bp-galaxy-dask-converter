replicaCount: 1

image:
  repository: ghcr.io/TomasVostinak/bp-galaxy-dask-converter
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: galaxy-vostinak.kuba.cerit-sc.cz # Tvar domény ověřte u vedoucího/v Rancheru

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"