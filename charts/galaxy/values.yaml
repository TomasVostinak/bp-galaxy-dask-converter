replicaCount: 1

image:
  repository: ghcr.io/tomasvostinak/bp-galaxy-dask-converter
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: galaxy-vostinak.dyn.cloud.e-infra.cz

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"