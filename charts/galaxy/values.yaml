app:
  name: galaxy

registry:
  host: ghcr.io

image:
  name: tomasvostinak/bp-galaxy-dask-converter
  tag: latest
  pullPolicy: Always

deployment:
  replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1450
  runAsGroup: 1450

service:
  type: ClusterIP
  externalPort:
    number: 80
    name: http
  internalPort:
    number: 80
    name: http

ingress:
  className: "nginx"
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: "galaxy-strata-ai.dyn.cloud.e-infra.cz"

resources:
  requests:
    cpu: "3"
    memory: "7500Mi"
  limits:
    cpu: "3250m"
    memory: "15000Mi"