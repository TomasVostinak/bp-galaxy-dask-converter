app:
  name: galaxy

registry:
  host: ghcr.io

image:
  name: tomasvostinak/bp-galaxy-dask-converter
  tag: latest
  pullPolicy: Always

deployment:
  replicaCount: 1

service:
  type: ClusterIP
  externalPort:
    number: 80
    name: http
  internalPort:
    number: 80
    name: http

ingress:
  className: "nginx"
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: "galaxy-strata-ai.dyn.cloud.e-infra.cz"

resources:
  requests:
    cpu: "4"
    memory: "12Gi"
  limits:
    cpu: "8"
    memory: "16Gi"y