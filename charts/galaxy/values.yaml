image:
  repository: ghcr.io/tomasvostinak/bp-galaxy-dask-converter
  tag: "0.1.0"
  pullPolicy: IfNotPresent

postgresql:
  enabled: true
  existingDatabase: "galaxy-postgres:5432"
  galaxyDatabaseUser: galaxy             # musí odpovídat klíči username v secretu galaxy-postgres-auth
  galaxyExistingSecret: galaxy-postgres-auth
  galaxyExistingSecretKeyRef: password
  galaxyConnectionParams: ""

rabbitmq:
  enabled: true
  existingCluster: galaxy-rabbitmq
  existingSecret: galaxy-rabbitmq-auth
  protocol: amqp
  port: 5672

cvmfs:
  deploy: false
  enabled: false
refdata:
  enabled: false
s3csi:
  deploy: false

jobs:
  priorityClass:
    enabled: false

persistence:
  enabled: true
  storageClass: nfs-csi
  size: 50Gi

securityContext:
  fsGroup: 10001
setupJob:
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  createDatabase: true

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  path: /
  hosts:
    - host: galaxy-strata-ai.dyn.cloud.e-infra.cz
      paths:
        - path: /
  tls:
    - hosts:
        - galaxy-strata-ai.dyn.cloud.e-infra.cz
      secretName: galaxy-tls

webHandlers:
  resources:
    requests: {cpu: 250m, memory: 1500Mi}
    limits: {memory: 3Gi}
jobHandlers:
  resources:
    requests: {cpu: 250m, memory: 750Mi}
    limits: {memory: 2Gi}
workflowHandlers:
  resources:
    requests: {cpu: 100m, memory: 500Mi}
    limits: {memory: 1536Mi}
celery:
  resources:
    requests: {cpu: 100m, memory: 400Mi}
    limits: {memory: 1Gi}
celeryBeat:
  resources:
    requests: {cpu: 50m, memory: 250Mi}
    limits: {memory: 512Mi}
nginx:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
tusd:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

configs:
  galaxy.yml:
    galaxy:
      admin_users: "admin@galaxy.org"
      # [OVĚŘIT] pokud chart neřeší externí broker jinak:
      # amqp_internal_connection: "amqp://USER:HESLO@galaxy-rabbitmq:5672/galaxy"
      # Vlastní nástroje z mytools - viz Dockerfile a local_tool_conf.xml.
      # POZOR: přepsáním tool_config_file přijdeš o výchozí nástroje chartu.
      # tool_config_file: "/galaxy/server/config/tool_conf.xml,/galaxy/server/config/local_tool_conf.xml"

cronJobs:
  maintenance:
    securityContext:
      runAsUser: 10001
  tmpdir:
    securityContext:
      runAsUser: 10001
