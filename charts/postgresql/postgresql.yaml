apiVersion: v1
kind: Service
metadata:
  name: galaxy-postgres
  labels:
    app: galaxy-postgres
spec:
  clusterIP: None            # headless, stabilní DNS pro StatefulSet
  selector:
    app: galaxy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: galaxy-postgres
  labels:
    app: galaxy-postgres
spec:
  serviceName: galaxy-postgres
  replicas: 1
  selector:
    matchLabels:
      app: galaxy-postgres
  template:
    metadata:
      labels:
        app: galaxy-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # uživatel "postgres" uvnitř oficiálního image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: galaxy
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: galaxy-postgres-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: galaxy-postgres-auth
                  key: password
            # podadresář, aby initdb nenarazil na lost+found v kořeni PVC
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d galaxy"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d galaxy"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-ceph-rbd-du
        resources:
          requests:
            storage: 10Gi
