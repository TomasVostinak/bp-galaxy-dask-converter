name: Deploy galaxy-helm to CERIT-SC

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Deploy to Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 700 ~/.kube/config

          kubectl create configmap galaxy-my-tools \
            --namespace vostinak-ns \
            --from-file=mytools/ \
            --dry-run=client -o yaml | kubectl apply -f -

          helm repo add cloudve https://raw.githubusercontent.com/CloudVE/helm-charts/master/
          helm repo update

          helm upgrade --install galaxy cloudve/galaxy \
            --namespace vostinak-ns \
            --values galaxy-values.yaml \
            --timeout 10m